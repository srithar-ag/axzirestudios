<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>AxZire Studios</title>
    <script>
      // Single Page App fallback redirect for GitHub Pages
      // Converts path to hash path e.g. /axzirestudios/support -> /axzirestudios/#/support
      var pathSegmentsToKeep = 1; // repository name
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <p>Redirecting to AxZire Studios...</p>
  </body>
</html>
